name: Publish VSIX to VS Marketplace

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            Write-Error "Invalid tag format. Use semantic versioning: v1.0.0"
            exit 1
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version extracted: $version"

      - name: Update version in vsixmanifest
        shell: pwsh
        run: |
          $manifestPath = "src/VsAgentic.VSExtension/source.extension.vsixmanifest"
          $version = "${{ steps.version.outputs.version }}"

          [xml]$manifest = Get-Content $manifestPath
          $manifest.PackageManifest.Metadata.Identity.Version = $version
          $manifest.Save($manifestPath)

          Write-Host "Updated manifest version to: $version"
          Get-Content $manifestPath | Select-String "Version="

      - name: Restore NuGet packages
        run: dotnet restore src/VsAgentic.slnx

      - name: Build VSIX package
        run: dotnet build src/VsAgentic.slnx -c Release -v minimal

      - name: Locate VSIX artifact
        id: vsix
        shell: pwsh
        run: |
          $vsixPath = Get-ChildItem -Path "src/VsAgentic.VSExtension/bin/Release" -Filter "*.vsix" -Recurse | Select-Object -First 1
          if (-not $vsixPath) {
            Write-Error "VSIX file not found in build output"
            exit 1
          }
          echo "path=$($vsixPath.FullName)" >> $env:GITHUB_OUTPUT
          # action-gh-release matches `files` as a glob, where a backslash is an
          # escape character, so the Windows path above matches nothing.
          echo "asset=$($vsixPath.FullName.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
          Write-Host "Found VSIX: $($vsixPath.Name)"

      # The windows-2025-vs2026 image of 2026-11-11 ships a VsixPublisher.exe.config
      # without a redirect for Microsoft.Identity.Client, so the publisher, built
      # against 4.85.2, fails to load the 4.87 in its lib folder (VsixPub0031).
      - name: Align VsixPublisher binding redirects with its lib folder
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $bin = Join-Path $vs "VSSDK\VisualStudioIntegration\Tools\Bin"
          $configPath = Join-Path $bin "VsixPublisher.exe.config"
          [xml]$config = Get-Content $configPath
          $asmNs = "urn:schemas-microsoft-com:asm.v1"
          $ns = New-Object Xml.XmlNamespaceManager $config.NameTable
          $ns.AddNamespace("asm", $asmNs)
          $binding = $config.SelectSingleNode("//asm:assemblyBinding", $ns)

          # Redirect every strong-named assembly the publisher ships to the
          # version it ships, the way generated binding redirects would.
          $dlls = Get-ChildItem "$bin\lib\vsixpublisher", "$bin\lib" -Filter *.dll -ErrorAction SilentlyContinue
          $seen = @{}
          foreach ($dll in $dlls) {
            try { $asm = [Reflection.AssemblyName]::GetAssemblyName($dll.FullName) } catch { continue }
            $token = -join ($asm.GetPublicKeyToken() | ForEach-Object { $_.ToString("x2") })
            if (-not $token -or $seen.ContainsKey($asm.Name)) { continue }
            $seen[$asm.Name] = $true
            $actual = $asm.Version.ToString()
            $range = "0.0.0.0-$actual"

            $identity = $config.SelectSingleNode("//asm:assemblyIdentity[@name='$($asm.Name)']", $ns)
            if ($identity) {
              $redirect = $identity.ParentNode.SelectSingleNode("asm:bindingRedirect", $ns)
              if ($redirect -and $redirect.GetAttribute("oldVersion") -eq $range -and $redirect.GetAttribute("newVersion") -eq $actual) { continue }
              if (-not $redirect) { $redirect = $identity.ParentNode.AppendChild($config.CreateElement("bindingRedirect", $asmNs)) }
            } else {
              $dep = $binding.AppendChild($config.CreateElement("dependentAssembly", $asmNs))
              $identity = $dep.AppendChild($config.CreateElement("assemblyIdentity", $asmNs))
              $identity.SetAttribute("name", $asm.Name)
              $identity.SetAttribute("publicKeyToken", $token)
              $identity.SetAttribute("culture", "neutral")
              $redirect = $dep.AppendChild($config.CreateElement("bindingRedirect", $asmNs))
            }
            $redirect.SetAttribute("oldVersion", $range)
            $redirect.SetAttribute("newVersion", $actual)
            Write-Host "Redirect $($asm.Name) $range -> $actual"
          }
          $config.Save($configPath)

      - name: Publish to VS Marketplace
        shell: pwsh
        run: |
          # Use VsixPublisher.exe from the Visual Studio installation on the runner
          $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          $vsixPublisher = Join-Path $vsInstallPath "VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe"

          if (-not (Test-Path $vsixPublisher)) {
            Write-Error "VsixPublisher.exe not found at: $vsixPublisher"
            Write-Host "VS install path: $vsInstallPath"
            # List what's available for debugging
            Get-ChildItem -Path $vsInstallPath -Filter "VsixPublisher.exe" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Using VsixPublisher from: $vsixPublisher"

          # Create a publish manifest in the repo root so overview path resolves
          $publishManifest = Join-Path "${{ github.workspace }}" "publish-manifest.json"
          @"
          {
            "`$schema": "http://json.schemastore.org/vsix-publish",
            "categories": ["programming languages"],
            "identity": {
              "internalName": "VsAgentic"
            },
            "overview": "README.md",
            "publisher": "adospace",
            "repo": "${{ github.server_url }}/${{ github.repository }}"
          }
          "@ | Set-Content $publishManifest

          & $vsixPublisher publish `
            -payload "${{ steps.vsix.outputs.path }}" `
            -publishManifest $publishManifest `
            -personalAccessToken "${{ secrets.MARKETPLACE_PAT }}"

      - name: Generate release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          # Find the previous tag to generate a changelog.
          # Use git tag --sort to list tags by version; the current tag is first,
          # so the second entry is the previous release.
          $tags = git tag --sort=-v:refname
          $prevTag = ($tags | Select-Object -Skip 1 -First 1)
          if ($prevTag) {
            # git returns one string per line; joined explicitly, because an array
            # expanded inside the here-string below is joined with spaces.
            $commits = (git log "$prevTag..HEAD" --pretty=format:"- %s" --no-merges) -join "`n"
          } else {
            $commits = "- Initial release"
          }

          # Build the full release body
          $body = @"
          ## VsAgentic v$version

          ### Changes

          $commits

          ### Links

          - [Install from VS Marketplace](https://marketplace.visualstudio.com/items?itemName=adospace.VsAgentic)

          > **Note:** If you see a persistent update banner after upgrading, uninstall the extension, restart Visual Studio, and reinstall from the Marketplace.
          "@

          $body | Set-Content "release-notes.txt" -Encoding utf8
          Write-Host $body

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.vsix.outputs.asset }}
          body_path: release-notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish summary
        shell: pwsh
        run: |
          Write-Host "========================================" -ForegroundColor Green
          Write-Host "VSIX Published Successfully!" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Extension Details:" -ForegroundColor Cyan
          Write-Host "  Name:      VsAgentic"
          Write-Host "  Version:   ${{ steps.version.outputs.version }}"
          Write-Host "  Tag:       ${{ github.ref_name }}"
          Write-Host "  VSIX File: ${{ steps.vsix.outputs.path }}"
          Write-Host ""
          Write-Host "Next Steps:" -ForegroundColor Cyan
          Write-Host "  1. Check VS Marketplace: https://marketplace.visualstudio.com/items?itemName=adospace.VsAgentic"
          Write-Host "  2. Review GitHub Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          Write-Host ""
