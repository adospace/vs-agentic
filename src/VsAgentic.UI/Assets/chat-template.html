<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
:root {
    --bg-primary: #1e1e1e;
    --bg-secondary: #252526;
    --bg-input: #3c3c3c;
    --text-primary: #d4d4d4;
    --text-heading: #e2e2e2;
    --text-muted: #808080;
    --border: #3c3c3c;
    --accent: #569cd6;
    --success: #4ec9b0;
    --error: #f44747;
    --info: #808080;
    --prompt-bg: #202830;
    --prompt-border: #3d4b59;
    --prompt-accent: #569cd6;
    --thinking-bg: #252526;
    --code-bg: #3c3c3c;
    --pre-bg: #1e1e1e;
}

* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Segoe UI', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    height: 100%;
}

#chat-container {
    overflow-y: auto;
    overflow-x: hidden;
    height: 100%;
    padding: 8px 0;
    /* Chromium draws the scrolled content on a layer of its own and keeps
       ClearType only where that layer is opaque; without a background of its
       own, all chat text falls back to grayscale antialiasing. */
    background: var(--bg-primary);
}

/* Custom scrollbar styling */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}
::-webkit-scrollbar-track {
    background: transparent;
}
::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb, rgba(128, 128, 128, 0.4));
    border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
    background: var(--scrollbar-thumb-hover, rgba(128, 128, 128, 0.7));
}
::-webkit-scrollbar-corner {
    background: transparent;
}

/* Jump-to-latest button: only shown once the user has scrolled away from the
   bottom, so reading back through a conversation is never interrupted by new
   output arriving off-screen below. */
#scroll-bottom-btn {
    position: fixed;
    /* Tucked into the very bottom-right corner: clear of the 8px scrollbar,
       and low enough to sit below the text of the last message rather than
       over it. */
    right: 14px;
    bottom: 4px;
    width: 28px;
    height: 28px;
    border-radius: 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
    z-index: 900;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
}
#scroll-bottom-btn.visible { display: flex; }
#scroll-bottom-btn:hover {
    color: var(--text-primary);
    background: var(--bg-input);
}
/* Something arrived below the fold while the user was reading elsewhere. */
#scroll-bottom-btn.has-new {
    color: var(--accent);
    border-color: var(--accent);
}

/* Find bar: opened with Ctrl+F, floats over the top-right of the chat. */
#find-bar {
    position: fixed;
    top: 6px;
    right: 14px;
    z-index: 950;
    display: none;
    align-items: center;
    gap: 2px;
    padding: 3px 4px 3px 6px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}
#find-bar.visible { display: flex; }
#find-bar input {
    width: 180px;
    background: var(--bg-input);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 6px;
    font: inherit;
    font-size: 12px;
    outline: none;
}
#find-bar input:focus { border-color: var(--accent); }
.find-count {
    min-width: 64px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
}
.find-count.none { color: var(--error); }
.find-btn {
    width: 22px;
    height: 22px;
    background: transparent;
    border: none;
    border-radius: 3px;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
}
.find-btn:hover {
    background: var(--bg-input);
    color: var(--text-primary);
}
::highlight(find-match) { background-color: rgba(234, 179, 8, 0.35); }
::highlight(find-current) { background-color: rgba(249, 115, 22, 0.9); color: #000; }

/* Copy button on hover */
.msg {
    position: relative;
}
.msg-copy-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 24px;
    height: 24px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
    padding: 0;
    font-size: 13px;
    line-height: 1;
}
.msg:hover .msg-copy-btn {
    opacity: 1;
}
.msg.code-hover .msg-copy-btn {
    opacity: 0;
    pointer-events: none;
}
.msg-copy-btn:hover {
    color: var(--text-primary);
    background: var(--bg-input);
}
.msg-copy-btn.copied {
    color: var(--success);
}

/* Custom context menu */
.ctx-menu {
    position: fixed;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 0;
    min-width: 120px;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    z-index: 1000;
    display: none;
}
.ctx-menu-item {
    padding: 4px 16px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-primary);
    user-select: none;
}
.ctx-menu-item:hover {
    background: var(--accent);
    color: #fff;
}

/* Message containers */
.msg { margin: 2px 12px; }

.msg-user {
    background: var(--prompt-bg);
    border: 1px solid var(--prompt-border);
    border-left: 4px solid var(--prompt-accent);
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 14px;
    margin-bottom: 12px;
}
/* Attached images: thumbnails by default, click to see the whole thing. */
.msg-images {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 4px 0 8px 0;
}
.msg-image {
    max-height: 120px;
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: zoom-in;
    display: block;
}
.msg-image.expanded {
    max-height: none;
    cursor: zoom-out;
}

.msg-user .msg-label {
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
    color: var(--prompt-accent);
}

.msg-assistant {
    padding: 0 8px;
}
.msg-assistant-inner {
    display: flex;
    gap: 6px;
}
.msg-assistant-bullet {
    color: var(--text-muted);
    font-size: 10px;
    margin-top: 2px;
    flex-shrink: 0;
}

.msg-toolstep {
    padding: 8px;
}
.toolstep-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
}
.toolstep-status { font-size: 10px; }
.toolstep-name { color: var(--text-muted); }

/* Mark on a step whose work runs on in the background (run_in_background).
   The step itself completes at once; this follows the work it started. */
.toolstep-bg {
    font-size: 11px;
    padding: 0 6px;
    border: 1px solid currentColor;
    border-radius: 8px;
    cursor: default;
}
.toolstep-bg-Running { color: var(--info); animation: bg-pulse 1.6s ease-in-out infinite; }
.toolstep-bg-Completed { color: var(--success); }
.toolstep-bg-Failed { color: var(--error); }
.toolstep-bg-Stopped { color: var(--text-muted); }
@keyframes bg-pulse { 50% { opacity: 0.45; } }

/* "Run in background" on a step whose command or subagent still holds the
   turn. Shaped like the mark it turns into. */
.toolstep-bgbtn {
    font: inherit;
    font-size: 11px;
    padding: 0 6px;
    color: var(--info);
    background: transparent;
    border: 1px solid currentColor;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
}
.toolstep-bgbtn:hover { background: var(--bg-input); }
.toolstep-bgbtn:disabled { opacity: 0.5; cursor: default; }

/* Notice: a one-line event from the extension, e.g. a background command that
   ended. Indented like a step, in muted text, with a colored outcome icon. */
.msg-notice {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
}
.notice-icon { font-weight: bold; }
.notice-Success .notice-icon { color: var(--success); }
.notice-Error .notice-icon { color: var(--error); }
.notice-Info .notice-icon { color: var(--text-muted); }

/* A line the CLI reports about the session: a retry, a hook's message. */
.msg-session-line {
    margin: 2px 12px;
    padding: 2px 8px;
    font-size: 12px;
    color: var(--text-muted);
}
.session-line-header {
    display: flex;
    align-items: baseline;
    gap: 6px;
}
.session-line-header .msg-status { font-size: 10px; flex: none; }
.msg-session-line .msg-body {
    margin: 2px 0 0 16px;
    font-size: 11px;
}
/* A compaction divides the conversation, so it is drawn as a divider. */
.msg-session-line.session-line-divider .session-line-header {
    justify-content: center;
}
.msg-session-line.session-line-divider .session-line-header::before,
.msg-session-line.session-line-divider .session-line-header::after {
    content: '';
    flex: 1;
    border-top: 1px solid var(--border);
    align-self: center;
}

.toolstep-expander {
    margin: 4px 0 0 18px;
    font-size: 11px;
}
.toolstep-expander-header {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    color: var(--text-muted);
    user-select: none;
}
.toolstep-expander-arrow {
    font-size: 8px;
    transition: transform 0.15s;
    display: inline-block;
}
.toolstep-expander-arrow.expanded {
    transform: rotate(90deg);
}
.toolstep-expander-content {
    display: none;
    color: var(--text-muted);
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    font-size: 11px;
    white-space: pre-wrap;
    margin-top: 4px;
}
.toolstep-expander-content.visible { display: block; }

.toolstep-body {
    margin: 4px 0 0 18px;
}
.toolstep-body.capped {
    max-height: 120px;
    overflow: hidden;
    position: relative;
}
.toolstep-body.capped::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30px;
    background: linear-gradient(transparent, var(--bg-primary));
}
.show-more-link {
    display: inline-block;
    margin: 4px 0 0 18px;
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    user-select: none;
}

.msg-thinking {
    padding: 0 8px;
}
.thinking-header {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
}
.thinking-arrow {
    font-size: 8px;
    transition: transform 0.15s;
    display: inline-block;
    color: var(--text-muted);
}
.thinking-arrow.expanded { transform: rotate(90deg); }
.thinking-status { font-size: 10px; }
.thinking-title {
    color: var(--text-muted);
    font-style: italic;
}
.thinking-content {
    display: none;
    background: var(--thinking-bg);
    border-radius: 4px;
    padding: 10px 8px;
    margin: 4px 0 4px 18px;
    color: var(--text-muted);
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    font-size: 11px;
    white-space: pre-wrap;
}
.thinking-content.visible { display: block; }
.thinking-content.capped {
    max-height: 200px;
    overflow: hidden;
    position: relative;
}
.thinking-content.capped::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30px;
    background: linear-gradient(transparent, var(--thinking-bg));
}

/* Activity group: one row standing in for a run of finished steps.
   A long task otherwise leaves the chat unreadable — every file read, every
   grep, every thought block claims its own space and the answer scrolls away.
   The row reports the step in flight while the task runs and what was done
   once it is over; the steps themselves are behind it, opened by hand. */
.activity {
    margin: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-secondary);
}
.activity-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    color: var(--text-muted);
}
.activity-arrow {
    font-size: 8px;
    transition: transform 0.15s;
    display: inline-block;
    flex-shrink: 0;
}
.activity-arrow.expanded { transform: rotate(90deg); }
.activity-dot {
    width: 6px;
    height: 6px;
    border-radius: 3px;
    background: var(--text-muted);
    flex-shrink: 0;
}
.activity.running .activity-dot {
    background: var(--accent);
    animation: activity-pulse 1.2s ease-in-out infinite;
}
.activity.has-error .activity-dot { background: var(--error); }
@keyframes activity-pulse { 50% { opacity: 0.25; } }
/* min-width:0 is what lets the ellipsis happen: without it the flex item
   refuses to shrink below the width of its text and the count is pushed out
   of the row instead. */
.activity-current {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.activity.running .activity-label { color: var(--text-primary); }
.activity-detail {
    color: var(--text-muted);
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    font-size: 11px;
}
.activity-count {
    flex-shrink: 0;
    font-size: 11px;
}
.activity-items {
    display: none;
    border-top: 1px solid var(--border);
    padding: 2px 0;
}
.activity-items.visible { display: block; }
/* A subagent's row, inside its Agent step and lined up with the step's body. */
.activity.subagent { margin: 4px 0 0 18px; }

/* Streaming indicator */
.streaming-cursor::after {
    content: '\25ae';
    animation: blink 1s step-end infinite;
    color: var(--text-muted);
}
@keyframes blink { 50% { opacity: 0; } }

/* Markdown content styles */
/* min-width:0 lets this flex/grid item shrink below its content width,
   so wide <pre> blocks scroll inside themselves instead of pushing the
   whole webview wider and triggering a chat-level horizontal scrollbar. */
.md-content { min-width: 0; }
.md-content h1 { font-size: 1.6em; margin: 0.4em 0; color: var(--text-heading); border-bottom: 1px solid var(--border); padding-bottom: 0.2em; }
.md-content h2 { font-size: 1.4em; margin: 0.4em 0; color: var(--text-heading); }
.md-content h3 { font-size: 1.2em; margin: 0.3em 0; color: var(--text-heading); }
.md-content h4, .md-content h5, .md-content h6 { font-size: 1.05em; margin: 0.3em 0; color: var(--text-heading); }
.md-content p { margin: 0.4em 0; }
.md-content a { color: var(--accent); text-decoration: none; }
.md-content a:hover { text-decoration: underline; }
.md-content a.file-link { cursor: pointer; text-decoration: underline dotted; }
.md-content strong { color: var(--text-heading); }
.md-content code {
    background: var(--code-bg);
    padding: 2px 5px;
    border-radius: 3px;
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    font-size: 0.9em;
}
.md-content pre {
    background: var(--pre-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    margin: 0.5em 0;
    overflow-x: auto;
}
.md-content pre code {
    background: none;
    padding: 0;
    border-radius: 0;
    font-size: 12px;
    color: var(--text-primary);
}
/* Copy button on code blocks. The <pre> is wrapped in .code-block so the
   button stays pinned when the code scrolls horizontally inside the <pre>. */
.code-block {
    position: relative;
}
.code-block > pre {
    /* Room for the button so it never sits on top of the first code line. */
    padding-right: 36px;
}
.code-copy-btn,
.quote-copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.45;
    transition: opacity 0.15s;
    z-index: 5;
    padding: 0;
    line-height: 1;
}
.code-block:hover .code-copy-btn { opacity: 1; }
.code-copy-btn:hover,
.quote-copy-btn:hover {
    color: var(--text-primary);
    background: var(--bg-input);
}
.code-copy-btn.copied,
.quote-copy-btn.copied {
    color: var(--success);
    opacity: 1;
}
.md-content blockquote {
    border-left: 3px solid var(--accent);
    margin: 0.5em 0;
    padding: 0.2em 0 0.2em 12px;
    color: #9e9e9e;
}
/* Copy button on block quotes. A quote is how a prompt to run is written, and
   the message-level button would take the whole answer around it. */
.quote-block {
    position: relative;
}
.quote-block > blockquote {
    /* Room for the button so it never sits on top of the quoted text. */
    padding-right: 36px;
}
.quote-block:hover .quote-copy-btn { opacity: 1; }
.md-content ul, .md-content ol { margin: 0.4em 0; padding-left: 1.6em; }
.md-content li { margin: 0.15em 0; }
.md-content table { border-collapse: collapse; margin: 0.5em 0; width: 100%; }
.md-content th, .md-content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.md-content th { background: var(--bg-secondary); color: var(--text-heading); }
.md-content tr:nth-child(even) { background: var(--bg-secondary); }
.md-content hr { border: none; border-top: 1px solid var(--border); margin: 0.6em 0; }
.md-content img { max-width: 100%; }
.md-content > *:first-child { margin-top: 0; }
.md-content > *:last-child { margin-bottom: 0; }
</style>
<script>{{SHOWDOWN_JS}}</script>
<script>
var converter = new showdown.Converter({
    tables: true,
    tasklists: true,
    strikethrough: true,
    ghCodeBlocks: true,
    simplifiedAutoLink: true,
    literalMidWordUnderscores: true,
    openLinksInNewWindow: true
});

// User-typed messages: preserve single newlines as <br> so multi-line
// chat input renders the way the user typed it.
var userConverter = new showdown.Converter({
    tables: true,
    tasklists: true,
    strikethrough: true,
    ghCodeBlocks: true,
    simplifiedAutoLink: true,
    literalMidWordUnderscores: true,
    openLinksInNewWindow: true,
    simpleLineBreaks: true
});

var _userScrolledUp = false;
var _container;

// Status symbols and colors
var STATUS_SYMBOLS = { Pending: '\u25cb', Success: '\u25cf', Error: '\u25cf', Info: '\u25cb' };
var STATUS_COLORS = { Pending: 'var(--info)', Success: 'var(--success)', Error: 'var(--error)', Info: 'var(--info)' };

// File path regex (same as markdown-template.html)
// File path regex: require extension starts lowercase to avoid false positives like RTR.MobileApp
var filePathRe = /(?:[A-Za-z]:[\\\/]|\.{0,2}\/|(?=[\w@]))(?:[\w\-\.@]+[\\\/])+[\w\-\.]+\.[a-z][a-zA-Z0-9]{0,9}(?::(\d+)(?:-\d+)?)?/g;

function linkifyFilePaths(container) {
    var codes = container.querySelectorAll('code');
    for (var i = 0; i < codes.length; i++) {
        var code = codes[i];
        if (code.closest('pre')) continue;
        if (code.querySelector('a')) continue;
        var text = code.textContent;
        filePathRe.lastIndex = 0;
        if (filePathRe.test(text) && text.match(filePathRe).length === 1 && text.trim() === text.match(filePathRe)[0]) {
            var match = text.match(filePathRe)[0];
            var a = document.createElement('a');
            a.href = '#';
            a.className = 'file-link';
            a.dataset.path = match;
            a.textContent = text;
            a.title = 'Open in editor';
            code.textContent = '';
            code.appendChild(a);
        }
    }
    var links = container.querySelectorAll('a[href]');
    for (var j = 0; j < links.length; j++) {
        var link = links[j];
        if (link.classList.contains('file-link')) continue; // already processed
        var href = link.getAttribute('href');
        if (!href) continue;
        if (/^(https?|mailto|ftp|javascript):/i.test(href)) continue;
        link.classList.add('file-link');
        link.dataset.path = href;
        link.title = 'Open in editor';
        link.href = '#';
    }

    // Walk text nodes outside <pre>/<code> and linkify file paths in plain text
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
    var textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);
    for (var k = 0; k < textNodes.length; k++) {
        var node = textNodes[k];
        if (node.parentNode.closest('pre, code, a')) continue;
        var txt = node.nodeValue;
        filePathRe.lastIndex = 0;
        if (!filePathRe.test(txt)) continue;
        filePathRe.lastIndex = 0;
        var frag = document.createDocumentFragment();
        var lastIdx = 0;
        var m;
        while ((m = filePathRe.exec(txt)) !== null) {
            if (m.index > lastIdx)
                frag.appendChild(document.createTextNode(txt.slice(lastIdx, m.index)));
            var a = document.createElement('a');
            a.href = '#';
            a.className = 'file-link';
            a.dataset.path = m[0];
            a.textContent = m[0];
            a.title = 'Open in editor';
            frag.appendChild(a);
            lastIdx = filePathRe.lastIndex;
        }
        if (lastIdx < txt.length)
            frag.appendChild(document.createTextNode(txt.slice(lastIdx)));
        node.parentNode.replaceChild(frag, node);
    }
}

function renderMd(text) {
    if (!text) return '';
    return converter.makeHtml(text);
}

function renderUserMd(text) {
    if (!text) return '';
    return userConverter.makeHtml(text);
}

// Keep the markdown a block was rendered from, so the copy button can hand
// back the source instead of the rendered text. Reading the DOM loses the
// syntax: a table arrives as bare cells with no pipes, and fenced code
// arrives with no fences.
function keepMarkdownSource(el, markdown) {
    if (markdown) el.dataset.md = markdown;
    else delete el.dataset.md;
}

function markdownSourceOf(el) {
    return el.dataset.md !== undefined ? el.dataset.md : el.innerText;
}

function isNearBottom() {
    if (!_container) return true;
    return _container.scrollHeight - _container.scrollTop - _container.clientHeight < 50;
}

function scrollToBottom() {
    if (_container) {
        _container.scrollTop = _container.scrollHeight;
    }
}

function maybeScrollToBottom() {
    if (_userScrolledUp) {
        // Reading further up: don't yank the view, just light up the button.
        _hasNewBelow = true;
        updateScrollButton();
    } else {
        scrollToBottom();
    }
}

// --- Jump-to-latest button ---

var _scrollBtn;
var _hasNewBelow = false;

var ICON_ARROW_DOWN = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="2.5" x2="8" y2="12.5"/><polyline points="3.5 8.5 8 13 12.5 8.5"/></svg>';

function updateScrollButton() {
    if (!_scrollBtn) return;
    if (!_userScrolledUp) _hasNewBelow = false;
    _scrollBtn.classList.toggle('visible', _userScrolledUp);
    _scrollBtn.classList.toggle('has-new', _userScrolledUp && _hasNewBelow);
    _scrollBtn.title = _hasNewBelow ? 'New messages below' : 'Scroll to latest';
}

function createScrollButton() {
    _scrollBtn = document.createElement('button');
    _scrollBtn.id = 'scroll-bottom-btn';
    _scrollBtn.title = 'Scroll to latest';
    _scrollBtn.innerHTML = ICON_ARROW_DOWN;
    _scrollBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        _userScrolledUp = false;
        scrollToBottom();
        updateScrollButton();
    });
    document.body.appendChild(_scrollBtn);
}

// --- Activity group ---
// Everything a turn does on its way to an answer — tool steps, thinking, and
// the running commentary between them — is folded into a single row, so what
// is left standing in the transcript is the prompt and the reply to it. Only
// the user's next prompt closes the row, which is what keeps it to one per
// turn.
//
// The reply itself has to stream where it can be seen, and there is no way to
// know that a block of text is the reply until the turn ends without anything
// following it. So text is left out in the open as it arrives and pulled into
// the row only once a further step proves it was commentary after all.

var _activityGroup = null;
var _pendingText = null;

function isActivityType(type) {
    return type === 'ToolStep' || type === 'Thinking';
}

// A turn that could not run at all. The service reports these as steps of its
// own: the CLI failing to start, whose body carries the install instructions,
// and a turn the CLI ended with an error. They are the one thing in a turn the
// user has to see, so they stay out of the folded row.
//
// The tool name is part of the test on purpose. An ordinary tool call that
// fails is a step like any other and belongs in the row; it is only reported as
// Success today (#46), and matching the status alone would throw every failed
// command out of the row the day that is fixed.
function isTurnFailure(type, data) {
    return type === 'ToolStep' && data.Status === 'Error' && data.ToolName === 'ClaudeCli';
}

// What the CLI reports about the session rather than a step toward the answer:
// an API retry, a compaction, a hook's message. The service reports these as
// steps with a tool name of their own (SessionLineSteps). Each is a line in the
// transcript, where it is read in order, not one more step in the folded row.
var SESSION_LINE_TOOLS = ['Retry', 'Compact', 'CliMessage'];

function isSessionLine(type, data) {
    return type === 'ToolStep' && SESSION_LINE_TOOLS.indexOf(data.ToolName) >= 0;
}

function setActivityLabel(group, text) {
    var label = group.querySelector('.activity-label');
    if (label) label.textContent = text || '';
}

function setActivityDetail(group, text) {
    var detail = group.querySelector('.activity-detail');
    if (detail) detail.textContent = text ? ' · ' + text : '';
}

function setActivityCount(group, count) {
    var el = group.querySelector('.activity-count');
    if (el) el.textContent = count === 1 ? '1 step' : count + ' steps';
}

// The one-line summary a group carries once it is closed: which tools ran,
// most recent last, so the row still says what happened without being opened.
function activitySummary(group) {
    var tools = group._tools || [];
    if (!tools.length) return 'Earlier output';
    if (tools.length <= 4) return tools.join(', ');
    return tools.slice(0, 4).join(', ') + ' +' + (tools.length - 4) + ' more';
}

// The step's own body is markdown meant for the expanded view; the header has
// one line, so take the first non-empty one and strip the markup that would
// otherwise show up as literal backticks and asterisks.
function activityDetailFrom(body) {
    if (!body) return '';
    var lines = body.split('\n');
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i].replace(/^```.*$/, '').replace(/[`*_]/g, '').trim();
        if (!line) continue;
        return line.length > 90 ? line.slice(0, 90) + '…' : line;
    }
    return '';
}

// `before` is the message the row has to open above: a group born of text that
// is only now shown to have been commentary belongs where that text was, not
// at the end of the chat. `host` is where a row without `before` goes; the
// chat, unless it is a subagent's row inside its Agent step.
function createActivityGroup(before, host) {
    var group = document.createElement('div');
    group.className = 'activity running';
    group._tools = [];
    group._count = 0;

    var header = document.createElement('div');
    header.className = 'activity-header';
    header.title = 'Show the individual steps';

    var arrow = document.createElement('span');
    arrow.className = 'activity-arrow';
    arrow.textContent = '▶';

    var dot = document.createElement('span');
    dot.className = 'activity-dot';

    var current = document.createElement('span');
    current.className = 'activity-current';
    var label = document.createElement('span');
    label.className = 'activity-label';
    label.textContent = 'Working…';
    var detail = document.createElement('span');
    detail.className = 'activity-detail';
    current.appendChild(label);
    current.appendChild(detail);

    var count = document.createElement('span');
    count.className = 'activity-count';

    header.appendChild(arrow);
    header.appendChild(dot);
    header.appendChild(current);
    header.appendChild(count);

    var items = document.createElement('div');
    items.className = 'activity-items';

    header.addEventListener('click', function() {
        var show = !items.classList.contains('visible');
        items.classList.toggle('visible', show);
        arrow.classList.toggle('expanded', show);
        header.title = show ? 'Hide the individual steps' : 'Show the individual steps';
        // Bodies that arrived while the group was shut could not be measured,
        // so their height cap is decided now, on the way open.
        if (show) applyPendingBodyCaps(items);
    });

    group.appendChild(header);
    group.appendChild(items);
    if (before) _container.insertBefore(group, before);
    else (host || _container).appendChild(group);
    return group;
}

// Text the turn has moved on from. Called before anything else is added, so
// the row it goes into is always the one it chronologically belongs to.
function absorbPendingText() {
    if (!_pendingText) return;
    var text = _pendingText;
    _pendingText = null;
    if (!_activityGroup) _activityGroup = createActivityGroup(text);
    _activityGroup.querySelector('.activity-items').appendChild(text);
}

function addToActivityGroup(div, type, data, group) {
    if (!group) {
        if (!_activityGroup) _activityGroup = createActivityGroup();
        group = _activityGroup;
    }

    group.querySelector('.activity-items').appendChild(div);
    group._count++;
    setActivityCount(group, group._count);

    // Marked here rather than only in updateStatus, so a step that is already
    // finished when it arrives still marks the row. That is every step in a
    // restored session, which is why the dot never turned red on one.
    if (data.Status === 'Error') group.classList.add('has-error');

    // A subagent goes by its description, so the row names which one ran.
    var tool = type === 'Thinking' ? 'Thinking'
             : (data.ToolName === 'Agent' && data.Title) ? data.Title
             : (data.ToolName || 'tool');
    var seen = group._tools.indexOf(tool);
    if (seen >= 0) group._tools.splice(seen, 1);
    group._tools.push(tool);

    if (type === 'Thinking') {
        setActivityLabel(group, data.ExpanderTitle || 'Thinking…');
        setActivityDetail(group, '');
    } else {
        setActivityLabel(group, data.Title || ('Using ' + tool));
        setActivityDetail(group, activityDetailFrom(data.Body));
    }
}

// --- Subagent steps ---
// A subagent's steps go under the Agent step that started it, in a folded row
// of their own like the turn's. A subagent can start one in turn, so rows nest.
// The row is live while the Agent step or any step in it is still running; a
// background subagent outlives its Agent step, and its row comes back to life
// with each step it sends.

// Steps whose Agent step is not on the page yet, by the Agent step's id. A
// step is saved when it completes, and an Agent step completes after its own
// steps, so a restored transcript lists them first.
var _orphanSteps = {};

function addSubagentStep(div, type, data) {
    // The Agent step may itself still wait for its own: an inner subagent's
    // steps are saved before the inner Agent step, and that before the outer.
    var agent = messageElement(data.ParentId);
    if (!agent) {
        (_orphanSteps[data.ParentId] = _orphanSteps[data.ParentId] || []).push({ div: div, type: type, data: data });
        return;
    }

    var group = agent._subagentGroup;
    if (!group) {
        group = createActivityGroup(null, agent);
        group.classList.add('subagent');
        group._subagent = true;
        agent._subagentGroup = group;
    }

    if (type === 'Assistant') {
        // The subagent's report. Not a step, so it neither counts nor names
        // the row, but it is part of what the subagent did.
        group.querySelector('.activity-items').appendChild(div);
    } else {
        addToActivityGroup(div, type, data, group);
    }
    refreshSubagentGroup(group);
}

// A message by id, also one still waiting for its Agent step, or inside one
// that is: a restored transcript sets the body of a step right after adding
// it, and nests steps before their outer Agent step has arrived.
function messageElement(id) {
    var el = document.getElementById('msg-' + id);
    if (el) return el;
    for (var parentId in _orphanSteps) {
        if (!_orphanSteps.hasOwnProperty(parentId)) continue;
        var waiting = _orphanSteps[parentId];
        for (var i = 0; i < waiting.length; i++) {
            var div = waiting[i].div;
            if (div.id === 'msg-' + id) return div;
            var inner = div.querySelector('#msg-' + id);
            if (inner) return inner;
        }
    }
    return null;
}

function adoptOrphanSteps(id) {
    var waiting = _orphanSteps[id];
    if (!waiting) return;
    delete _orphanSteps[id];
    for (var i = 0; i < waiting.length; i++) {
        addSubagentStep(waiting[i].div, waiting[i].type, waiting[i].data);
    }
}

// Steps whose Agent step never arrived, in a transcript saved while one was
// still running. Shown with the turn's other steps rather than lost.
function releaseOrphanSteps() {
    var waiting = _orphanSteps;
    _orphanSteps = {};
    for (var parentId in waiting) {
        if (!waiting.hasOwnProperty(parentId)) continue;
        for (var i = 0; i < waiting[parentId].length; i++) {
            var o = waiting[parentId][i];
            o.data.ParentId = null;
            placeMessage(o.div, o.type, o.data);
        }
    }
}

function refreshSubagentGroup(group) {
    var agent = group.parentNode;
    var running = agent.dataset.status === 'Pending'
        || !!group.querySelector('.activity-items .msg[data-status="Pending"]');
    if (running) {
        group.classList.add('running');
        return;
    }
    group.classList.remove('running');
    setActivityLabel(group, activitySummary(group));
    setActivityDetail(group, '');
}

function closeActivityGroup() {
    // Whatever text is standing outside at this point is the reply the turn
    // ended on, and stays where the user can read it.
    _pendingText = null;
    if (!_activityGroup) return;
    var group = _activityGroup;
    _activityGroup = null;
    group.classList.remove('running');
    setActivityLabel(group, activitySummary(group));
    setActivityDetail(group, '');
}

// --- Public API ---

// Called by the host when the turn is over. Without it a group whose last step
// is a tool call would keep its live header, pulsing at nothing, until the next
// message happened to close it.
function endActivity() {
    closeActivityGroup();
}

function addMessage(id, type, dataJson) {
    var data = typeof dataJson === 'string' ? JSON.parse(dataJson) : dataJson;
    var div = document.createElement('div');
    div.id = 'msg-' + id;
    div.className = 'msg';
    div.dataset.type = type;
    // Read by a subagent's row to tell whether anything in it still runs.
    div.dataset.status = data.Status || 'Pending';

    if (type === 'User') {
        div.classList.add('msg-user');
        var label = document.createElement('div');
        label.className = 'msg-label';
        label.textContent = 'YOU';
        div.appendChild(label);

        if (data.Images && data.Images.length) {
            var strip = document.createElement('div');
            strip.className = 'msg-images';
            for (var ii = 0; ii < data.Images.length; ii++) {
                var thumb = document.createElement('img');
                // Data URI built on the host side; never user-authored markup.
                thumb.src = data.Images[ii];
                thumb.className = 'msg-image';
                thumb.addEventListener('click', function() {
                    this.classList.toggle('expanded');
                });
                // A thumbnail has no height until it decodes, so the scroll
                // that follows the prompt runs against a container that is
                // still too short. Land on the bottom again once it does.
                thumb.addEventListener('load', function() {
                    if (!_userScrolledUp) scrollToBottom();
                });
                strip.appendChild(thumb);
            }
            div.appendChild(strip);
        }

        var content = document.createElement('div');
        content.className = 'md-content msg-content';
        content.innerHTML = renderUserMd(data.Content || '');
        keepMarkdownSource(content, data.Content || '');
        linkifyFilePaths(content);
        addBlockCopyButtons(content);
        div.appendChild(content);
    }
    else if (type === 'Assistant') {
        div.classList.add('msg-assistant');
        var inner = document.createElement('div');
        inner.className = 'msg-assistant-inner';
        var bullet = document.createElement('span');
        bullet.className = 'msg-assistant-bullet';
        bullet.textContent = '\u25cf';
        var content = document.createElement('div');
        content.className = 'md-content msg-content';
        if (data.IsStreaming) content.classList.add('streaming-cursor');
        content.innerHTML = renderMd(data.Content || '');
        keepMarkdownSource(content, data.Content || '');
        linkifyFilePaths(content);
        addBlockCopyButtons(content);
        inner.appendChild(bullet);
        inner.appendChild(content);
        div.appendChild(inner);
    }
    else if (isSessionLine(type, data)) {
        div.classList.add('msg-session-line');
        if (data.ToolName === 'Compact') div.classList.add('session-line-divider');
        var header = document.createElement('div');
        header.className = 'session-line-header';
        var statusSpan = document.createElement('span');
        statusSpan.className = 'msg-status';
        statusSpan.style.color = STATUS_COLORS[data.Status] || STATUS_COLORS.Pending;
        statusSpan.textContent = STATUS_SYMBOLS[data.Status] || STATUS_SYMBOLS.Pending;
        // The title is the message. Text, not markup: it is the CLI's or a
        // hook's own words.
        var title = document.createElement('span');
        title.className = 'msg-expander-title';
        title.textContent = data.ExpanderTitle || data.Title || '';
        header.appendChild(statusSpan);
        header.appendChild(title);
        div.appendChild(header);

        var body = document.createElement('div');
        body.className = 'md-content msg-body';
        body.style.display = 'none';
        div.appendChild(body);
    }
    else if (type === 'ToolStep') {
        div.classList.add('msg-toolstep');
        // Header row
        var header = document.createElement('div');
        header.className = 'toolstep-header';
        var statusSpan = document.createElement('span');
        statusSpan.className = 'toolstep-status msg-status';
        statusSpan.style.color = STATUS_COLORS[data.Status] || STATUS_COLORS.Pending;
        statusSpan.textContent = STATUS_SYMBOLS[data.Status] || STATUS_SYMBOLS.Pending;
        var nameSpan = document.createElement('span');
        nameSpan.className = 'toolstep-name';
        nameSpan.textContent = '[' + (data.ToolName || '') + ']';
        // An Agent step's title is the description the model gave its
        // subagent. The expander that shows it is hidden once the step is
        // done, and without it two subagents cannot be told apart.
        if (data.ToolName === 'Agent' && data.Title) nameSpan.textContent += ' ' + data.Title;
        header.appendChild(statusSpan);
        header.appendChild(nameSpan);
        div.appendChild(header);

        // Streaming expander
        if (data.IsStreaming) {
            var expander = document.createElement('div');
            expander.className = 'toolstep-expander msg-expander';
            var expHeader = document.createElement('div');
            expHeader.className = 'toolstep-expander-header';
            var arrow = document.createElement('span');
            arrow.className = 'toolstep-expander-arrow';
            arrow.textContent = '\u25b6';
            var expTitle = document.createElement('span');
            expTitle.className = 'msg-expander-title';
            expTitle.textContent = data.ExpanderTitle || data.Title || '';
            expHeader.appendChild(arrow);
            expHeader.appendChild(expTitle);
            expHeader.addEventListener('click', function() {
                var a = this.querySelector('.toolstep-expander-arrow');
                var c = this.nextElementSibling;
                if (c) {
                    var show = !c.classList.contains('visible');
                    c.classList.toggle('visible', show);
                    a.classList.toggle('expanded', show);
                }
            });
            var expContent = document.createElement('div');
            expContent.className = 'toolstep-expander-content msg-streaming-content';
            expContent.textContent = data.Content || '';
            expander.appendChild(expHeader);
            expander.appendChild(expContent);
            div.appendChild(expander);
        }

        // Body placeholder (populated on completion)
        var body = document.createElement('div');
        body.className = 'md-content toolstep-body msg-body';
        body.style.display = 'none';
        div.appendChild(body);
    }
    else if (type === 'Notice') {
        div.classList.add('msg-notice', 'notice-' + (data.Status || 'Info'));
        var icon = document.createElement('span');
        icon.className = 'notice-icon';
        icon.textContent = NOTICE_ICONS[data.Status] || NOTICE_ICONS.Info;
        var text = document.createElement('span');
        text.className = 'notice-text';
        text.textContent = data.Content || '';
        div.appendChild(icon);
        div.appendChild(text);
        // A shell command that ran in the background: the file the CLI wrote
        // its output to. It opens like any other file link.
        if (data.Body) {
            var output = document.createElement('a');
            output.href = '#';
            output.className = 'file-link';
            output.dataset.path = data.Body;
            output.title = data.Body;
            output.textContent = 'Open output';
            div.appendChild(output);
        }
    }
    else if (type === 'Thinking') {
        div.classList.add('msg-thinking');
        var header = document.createElement('div');
        header.className = 'thinking-header';
        var arrow = document.createElement('span');
        arrow.className = 'thinking-arrow';
        arrow.textContent = '\u25b6';
        var statusSpan = document.createElement('span');
        statusSpan.className = 'thinking-status msg-status';
        statusSpan.style.color = STATUS_COLORS[data.Status] || STATUS_COLORS.Pending;
        statusSpan.textContent = STATUS_SYMBOLS[data.Status] || STATUS_SYMBOLS.Pending;
        var title = document.createElement('span');
        title.className = 'thinking-title msg-expander-title';
        title.textContent = data.ExpanderTitle || 'Thinking...';
        header.appendChild(arrow);
        header.appendChild(statusSpan);
        header.appendChild(title);
        header.addEventListener('click', function() {
            var a = this.querySelector('.thinking-arrow');
            var c = this.nextElementSibling;
            if (c) {
                var show = !c.classList.contains('visible');
                c.classList.toggle('visible', show);
                a.classList.toggle('expanded', show);
                if (show) {
                    requestAnimationFrame(function() {
                        var existingLink = c.parentNode.querySelector('.show-more-link');
                        if (existingLink) {
                            existingLink.style.display = '';
                        } else {
                            // Measure scrollHeight BEFORE adding capped class so
                            // overflow:hidden doesn't clamp the reported height.
                            var fullHeight = c.scrollHeight;
                            if (fullHeight > 200) {
                                c.classList.add('capped');
                                var link = document.createElement('span');
                                link.className = 'show-more-link';
                                link.textContent = 'Show more';
                                link.addEventListener('click', function(e) {
                                    e.stopPropagation();
                                    var isCapped = c.classList.contains('capped');
                                    c.classList.toggle('capped', !isCapped);
                                    link.textContent = isCapped ? 'Show less' : 'Show more';
                                });
                                c.parentNode.insertBefore(link, c.nextSibling);
                            }
                        }
                    });
                } else {
                    // Hide show-more link when collapsing
                    var link = this.parentNode.querySelector('.show-more-link');
                    if (link) link.style.display = 'none';
                }
            }
        });
        var content = document.createElement('div');
        content.className = 'thinking-content msg-streaming-content';
        content.textContent = data.Content || '';
        div.appendChild(header);
        div.appendChild(content);
    }

    placeMessage(div, type, data);
    adoptOrphanSteps(id);
}

function placeMessage(div, type, data) {
    if (data.ParentId) {
        addSubagentStep(div, type, data);
        maybeScrollToBottom();
    } else if (type === 'User') {
        // A new prompt ends the previous turn's row for good.
        closeActivityGroup();
        _container.appendChild(div);
        // A prompt the user just sent themselves: take them to it no matter
        // where they were reading. Only output that arrives on its own is
        // allowed to stay below the fold.
        _userScrolledUp = false;
        scrollToBottom();
        updateScrollButton();
    } else if (type === 'Notice') {
        // Background work ending is a boundary like a prompt: the CLI wakes up
        // after it and starts a turn of its own. Close the row so that turn's
        // steps do not fold into the last one, nor take its reply with them,
        // and leave the notice standing.
        closeActivityGroup();
        _container.appendChild(div);
        maybeScrollToBottom();
    } else if (isSessionLine(type, data)) {
        // Steps after the notice open a row of their own below it, so the
        // transcript keeps the order things happened in. Text standing before
        // it stays where it is: it may be the reply, which a Stop hook's
        // message follows.
        closeActivityGroup();
        _container.appendChild(div);
        maybeScrollToBottom();
    } else if (isTurnFailure(type, data)) {
        // Left standing, and the text before it left alone: when a turn ends in
        // an error, that text is usually as far as the answer got, and folding
        // it away takes both the answer and the reason off the screen at once.
        _container.appendChild(div);
        maybeScrollToBottom();
    } else if (isActivityType(type)) {
        absorbPendingText();
        addToActivityGroup(div, type, data);
        maybeScrollToBottom();
    } else {
        // No absorbing here. Text is only commentary once a step follows it,
        // and nothing that reaches this branch is a step. The service does not
        // send two assistant items in a row, so in practice this is the
        // "Processing stopped." or "Error:" message the view model adds when a
        // turn is cancelled or throws — and the reply it interrupts has to stay
        // where it can be read.
        _container.appendChild(div);
        _pendingText = div;
        maybeScrollToBottom();
    }
}

var _rafPending = {};
function updateContent(id, contentMarkdown) {
    if (_rafPending[id]) return;
    _rafPending[id] = requestAnimationFrame(function() {
        delete _rafPending[id];
        var el = document.getElementById('msg-' + id);
        if (!el) return;
        var type = el.dataset.type;

        if (type === 'User' || type === 'Assistant') {
            var mc = el.querySelector('.msg-content');
            if (mc) {
                mc.innerHTML = type === 'User' ? renderUserMd(contentMarkdown) : renderMd(contentMarkdown);
                keepMarkdownSource(mc, contentMarkdown);
                linkifyFilePaths(mc);
                addBlockCopyButtons(mc);
            }
        } else if (type === 'ToolStep' || type === 'Thinking') {
            var sc = el.querySelector('.msg-streaming-content');
            if (sc) sc.textContent = contentMarkdown;
        }
        maybeScrollToBottom();
    });
}

function updateStatus(id, status, expanderTitle) {
    var el = document.getElementById('msg-' + id);
    if (!el) return;
    el.dataset.status = status;
    var st = el.querySelector('.msg-status');
    if (st) {
        st.textContent = STATUS_SYMBOLS[status] || STATUS_SYMBOLS.Pending;
        st.style.color = STATUS_COLORS[status] || STATUS_COLORS.Pending;
    }
    if (expanderTitle) {
        var et = el.querySelector('.msg-expander-title');
        if (et) et.textContent = expanderTitle;
    }
    if (status !== 'Pending') removeMoveToBackground(id);

    if (el._subagentGroup) refreshSubagentGroup(el._subagentGroup);

    // The folded row speaks for whichever step is in flight, so a title that
    // moves on (thinking counting its seconds) has to move the row with it.
    var group = el.closest('.activity');
    if (!group) return;
    if (status === 'Error') group.classList.add('has-error');
    if (group._subagent) refreshSubagentGroup(group);
    if (!group.classList.contains('running') || !expanderTitle) return;
    var items = group.querySelector('.activity-items');
    if (items.lastElementChild === el) setActivityLabel(group, expanderTitle);
}

var NOTICE_ICONS = { Success: '✓', Error: '✗', Info: '■' };

var BG_LABELS = {
    Running: '⧗ running in background',
    Completed: '✓ background done',
    Failed: '✗ background failed',
    Stopped: '■ background stopped'
};

// Marks a tool step whose work runs on in the background. Called again with
// the outcome when the CLI reports the work ended; the summary (e.g. the exit
// code) goes into the tooltip.
function setBackgroundState(id, state, summary) {
    removeMoveToBackground(id);
    var el = document.getElementById('msg-' + id);
    if (!el) return;
    var header = el.querySelector('.toolstep-header');
    if (!header) return;
    var badge = header.querySelector('.toolstep-bg');
    if (!badge) {
        badge = document.createElement('span');
        header.appendChild(badge);
    }
    badge.className = 'toolstep-bg toolstep-bg-' + state;
    badge.textContent = BG_LABELS[state] || state;
    badge.title = summary || '';
}

// Offers "Run in background" on a step whose command or subagent holds the
// turn. The CLI makes that possible a few seconds into the step. While the
// step runs it is usually folded into the activity row, so the button goes on
// the row's header, which is what the user sees; a step outside a row gets it
// on its own header.
function setCanMoveToBackground(id) {
    var el = document.getElementById('msg-' + id);
    if (!el || el.dataset.done || moveToBackgroundButton(id)) return;
    var group = el.closest('.activity');
    var host = group ? group.querySelector('.activity-header') : el.querySelector('.toolstep-header');
    if (!host) return;

    var btn = document.createElement('button');
    btn.className = 'toolstep-bgbtn';
    btn.dataset.bgStep = id;
    btn.textContent = 'Run in background';
    btn.title = 'Let ' + (el.querySelector('.toolstep-name') || {textContent: 'this step'}).textContent +
        ' go on in the background and continue the turn';
    btn.addEventListener('click', function(e) {
        // The row header opens and closes the row on a click.
        e.stopPropagation();
        btn.disabled = true;
        window.chrome.webview.postMessage(JSON.stringify({type:'moveToBackground', id:id}));
    });
    host.insertBefore(btn, group ? host.querySelector('.activity-count') : null);
}

function moveToBackgroundButton(id) {
    var buttons = document.querySelectorAll('.toolstep-bgbtn');
    for (var i = 0; i < buttons.length; i++)
        if (buttons[i].dataset.bgStep === id) return buttons[i];
    return null;
}

function removeMoveToBackground(id) {
    var btn = moveToBackgroundButton(id);
    if (btn) btn.remove();
}

function setBody(id, bodyContent, bodyMode) {
    var el = messageElement(id);
    if (!el) return;
    var body = el.querySelector('.msg-body');
    if (!body) return;
    if (!bodyContent) { body.style.display = 'none'; return; }

    if (bodyMode === 'Html') {
        body.innerHTML = bodyContent;
        // The host built this HTML itself, so there is no markdown to keep.
        keepMarkdownSource(body, '');
    } else {
        body.innerHTML = renderMd(bodyContent);
        keepMarkdownSource(body, bodyContent);
    }
    linkifyFilePaths(body);
    addBlockCopyButtons(body);
    body.style.display = '';

    // Apply cap and show-more link
    body.classList.add('capped');
    if (body.offsetParent === null) {
        // Inside a folded activity group. A hidden element reports a height of
        // zero, so measuring now would take the cap off every body and the
        // group would open onto the full output of every step it holds.
        body.dataset.capPending = '1';
    } else {
        requestAnimationFrame(function() { applyBodyCap(el, body); });
    }
    maybeScrollToBottom();
}

// Caps a rendered body at the height the CSS allows and gives it a show-more
// link, unless it is short enough to stand on its own. The element has to be
// visible: this reads scrollHeight.
function applyBodyCap(el, body) {
    delete body.dataset.capPending;
    if (body.scrollHeight <= 120) {
        body.classList.remove('capped');
        return;
    }
    // Add show more link if not already present. Only the body's own: an
    // Agent step also holds the links of its subagent's steps.
    var existing = body.nextElementSibling;
    if (existing && existing.classList.contains('show-more-link')) return;
    var link = document.createElement('span');
    link.className = 'show-more-link';
    link.textContent = 'Show more';
    link.addEventListener('click', function() {
        var isCapped = body.classList.contains('capped');
        body.classList.toggle('capped', !isCapped);
        link.textContent = isCapped ? 'Show less' : 'Show more';
    });
    body.parentNode.insertBefore(link, body.nextSibling);
}

function applyPendingBodyCaps(items) {
    var pending = items.querySelectorAll('.msg-body[data-cap-pending]');
    for (var i = 0; i < pending.length; i++) {
        var body = pending[i];
        // Still hidden in a subagent's row that stays shut; measured when
        // that row opens.
        if (body.offsetParent === null) continue;
        applyBodyCap(body.closest('.msg'), body);
    }
}

function completeMessage(id) {
    var el = messageElement(id);
    if (!el) return;
    var type = el.dataset.type;

    // Remove streaming cursor
    var mc = el.querySelector('.msg-content');
    if (mc) mc.classList.remove('streaming-cursor');

    // Hide streaming expander for tool steps
    if (type === 'ToolStep') {
        var exp = el.querySelector('.msg-expander');
        if (exp) exp.style.display = 'none';
        // The offer can arrive just after the step ended; it must not stand.
        el.dataset.done = '1';
        removeMoveToBackground(id);
    }
}

function clearAll() {
    if (_container) _container.innerHTML = '';
    _activityGroup = null;
    _pendingText = null;
    _orphanSteps = {};
    _userScrolledUp = false;
    updateScrollButton();
}

function loadMessages(jsonArray) {
    var messages = typeof jsonArray === 'string' ? JSON.parse(jsonArray) : jsonArray;
    for (var i = 0; i < messages.length; i++) {
        var m = messages[i];
        addMessage(m.Id, m.Type, m);
        // For completed messages with body, set it
        if (m.Body) {
            setBody(m.Id, m.Body, m.BodyMode || 'Markdown');
        }
        // Mark as completed (removes streaming indicators)
        if (!m.IsStreaming) {
            completeMessage(m.Id);
        }
    }
    releaseOrphanSteps();
    // Nothing in a restored transcript is still running, including a run of
    // steps that the session ended on.
    closeActivityGroup();
    _userScrolledUp = false;
    scrollToBottom();
    updateScrollButton();
}

function setThemeColors(colorsJson) {
    var colors = typeof colorsJson === 'string' ? JSON.parse(colorsJson) : colorsJson;
    var root = document.documentElement;
    for (var key in colors) {
        if (colors.hasOwnProperty(key)) {
            root.style.setProperty(key, colors[key]);
        }
    }
}

// --- Event handlers ---

// The host resolves the path, so it also does the work: only it knows the
// solution directory a relative path hangs off.
function requestFileLink(action, path) {
    window.chrome.webview.postMessage(JSON.stringify({type:'fileLink', action:action, path:path}));
}

document.addEventListener('click', function(e) {
    var link = e.target.closest('a.file-link');
    if (link) {
        e.preventDefault();
        var path = link.dataset.path;
        if (path) requestFileLink('open', path);
    }
});

// Clicking in the transcript means the user is looking at this session, which
// is one of the things that clears its "turn finished" indicator. The host
// cannot see it for itself: this page is a browser child window, so the click
// is neither a WPF mouse event nor necessarily a change of WPF focus.
// pointerdown in the capture phase, so a handler that stops propagation (the
// file links above, text selection) cannot swallow the signal.
document.addEventListener('pointerdown', function() {
    window.chrome.webview.postMessage(JSON.stringify({type:'click'}));
}, true);

// Whether the user is in this session at all, for the same reason: focus
// sitting in the transcript is focus the host cannot see. blur fires when the
// browser hands focus back to the chrome around it and when the whole
// application goes to the background, which is the distinction the host wants.
function reportFocus(hasFocus) {
    window.chrome.webview.postMessage(JSON.stringify({type:'focus', hasFocus:hasFocus}));
}

window.addEventListener('focus', function() { reportFocus(true); });
window.addEventListener('blur', function() { reportFocus(false); });

// --- Zoom ---
// The host owns the zoom level, because it also scales the input box and the
// banners that sit outside this page. Ctrl+wheel and Ctrl+/- are swallowed by
// the browser whenever the pointer or focus is in here, so forward the intent
// rather than acting on it: +1 in, -1 out, 0 back to 100%.
function requestZoom(step) {
    window.chrome.webview.postMessage(JSON.stringify({type:'zoom', step:step}));
}

// passive:false — preventDefault is ignored on a passive wheel listener, and
// the chat would scroll while zooming.
window.addEventListener('wheel', function(e) {
    if (!e.ctrlKey || e.deltaY === 0) return;
    e.preventDefault();
    requestZoom(e.deltaY < 0 ? 1 : -1);
}, {passive: false});

window.addEventListener('keydown', function(e) {
    if (!e.ctrlKey || e.altKey) return;
    // e.code catches the numpad and layouts where '+' needs a shift; e.key
    // catches the rest. '=' is the unshifted US '+' key, which browsers accept.
    if (e.key === '+' || e.key === '=' || e.code === 'NumpadAdd') requestZoom(1);
    else if (e.key === '-' || e.code === 'NumpadSubtract') requestZoom(-1);
    else if (e.key === '0' || e.code === 'Numpad0') requestZoom(0);
    else return;
    e.preventDefault();
});

// --- Find in transcript ---
// Ctrl+F opens a bar over the top of the chat. Matches are painted with the
// CSS Custom Highlight API instead of being wrapped in elements: messages keep
// their markdown source on the elements, and a streaming reply rewrites its
// element on every chunk. Extra spans would get in the way of both.

var _findBar, _findInput, _findCount;
var _findMatches = [];
var _findIndex = -1;
var _findObserver = null;
var _findRefreshTimer = 0;
var _findCanPaint = !!(window.CSS && CSS.highlights && window.Highlight);

// Text that belongs to the page's own controls, not to the conversation.
var FIND_SKIP = '.msg-label, .msg-status, .msg-copy-btn, .code-copy-btn, .quote-copy-btn, ' +
    '.show-more-link, .activity-arrow, .toolstep-expander-arrow, .thinking-arrow';

var ICON_ARROW_UP = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="13.5" x2="8" y2="3.5"/><polyline points="3.5 7.5 8 3 12.5 7.5"/></svg>';
var ICON_CLOSE = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>';

function findButton(icon, title, run) {
    var btn = document.createElement('button');
    btn.className = 'find-btn';
    btn.title = title;
    btn.innerHTML = icon;
    // Keep the focus in the input, so Enter goes on working after a click.
    btn.addEventListener('mousedown', function(e) { e.preventDefault(); });
    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        run();
    });
    return btn;
}

function createFindBar() {
    _findBar = document.createElement('div');
    _findBar.id = 'find-bar';

    _findInput = document.createElement('input');
    _findInput.type = 'text';
    _findInput.placeholder = 'Find in chat';
    _findInput.spellcheck = false;
    _findInput.addEventListener('input', function() { runFind(true); });
    _findInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            stepFind(e.shiftKey ? -1 : 1);
        } else if (e.key === 'Escape') {
            e.preventDefault();
            closeFind();
        }
    });

    _findCount = document.createElement('span');
    _findCount.className = 'find-count';

    _findBar.appendChild(_findInput);
    _findBar.appendChild(_findCount);
    _findBar.appendChild(findButton(ICON_ARROW_UP, 'Previous match (Shift+Enter)', function() { stepFind(-1); }));
    _findBar.appendChild(findButton(ICON_ARROW_DOWN, 'Next match (Enter)', function() { stepFind(1); }));
    _findBar.appendChild(findButton(ICON_CLOSE, 'Close (Esc)', closeFind));
    document.body.appendChild(_findBar);
}

function isFindOpen() {
    return !!_findBar && _findBar.classList.contains('visible');
}

// Called by the page on Ctrl+F, and by the host when the key reaches it first.
function openFind() {
    if (!_findBar) createFindBar();

    // A short selection on one line is most likely what the user wants found.
    var sel = window.getSelection().toString();
    if (sel && sel.length <= 100 && sel.indexOf('\n') < 0) _findInput.value = sel;

    var reopened = isFindOpen();
    _findBar.classList.add('visible');
    _findInput.focus();
    _findInput.select();

    if (!_findObserver && window.MutationObserver) {
        // Output keeps arriving while the bar is open. Recount after it settles,
        // without moving the view.
        _findObserver = new MutationObserver(function() {
            clearTimeout(_findRefreshTimer);
            _findRefreshTimer = setTimeout(function() { runFind(false); }, 200);
        });
        _findObserver.observe(_container, { childList: true, subtree: true, characterData: true });
    }

    if (!reopened) runFind(true);
}

// F3 and Shift+F3, whether the page or the host saw the key. A closed bar
// opens instead, as in a browser.
function findNext(direction) {
    if (isFindOpen()) stepFind(direction);
    else openFind();
}

function closeFind() {
    if (!_findBar) return;
    _findBar.classList.remove('visible');
    clearTimeout(_findRefreshTimer);
    if (_findObserver) {
        _findObserver.disconnect();
        _findObserver = null;
    }
    _findMatches = [];
    _findIndex = -1;
    paintFind();
}

function collectMatches(query) {
    var matches = [];
    if (!query) return matches;
    var needle = query.toLowerCase();

    var walker = document.createTreeWalker(_container, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
            var parent = node.parentElement;
            if (!parent || parent.closest(FIND_SKIP)) return NodeFilter.FILTER_REJECT;
            // Hidden for good, not folded: an empty step body, or the live
            // output of a step that has finished.
            if (parent.closest('[style*="display: none"]')) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
        }
    });

    var node;
    while ((node = walker.nextNode())) {
        var text = node.nodeValue.toLowerCase();
        var from = 0, at;
        while ((at = text.indexOf(needle, from)) >= 0) {
            var range = document.createRange();
            range.setStart(node, at);
            range.setEnd(node, Math.min(at + needle.length, node.nodeValue.length));
            matches.push(range);
            from = at + needle.length;
        }
    }
    return matches;
}

// Where a match sits on screen. A match inside a folded group has no box of
// its own, so the nearest ancestor that is shown stands in for it.
function findAnchorTop(range) {
    var rect = range.getBoundingClientRect();
    if (rect.width || rect.height) return rect.top;
    var el = range.startContainer.parentElement;
    while (el && !el.getClientRects().length) el = el.parentElement;
    return el ? el.getBoundingClientRect().top : 0;
}

// The first match in view, else the next one below it, else the last one
// above it — the one closest to where the user is reading.
function pickStartIndex() {
    var box = _container.getBoundingClientRect();
    for (var i = 0; i < _findMatches.length; i++) {
        if (findAnchorTop(_findMatches[i]) >= box.top) return i;
    }
    return _findMatches.length - 1;
}

// jump: a new term, so go to the nearest match. Otherwise the transcript
// changed under the bar; keep the same match current and leave the view alone.
function runFind(jump) {
    var current = _findMatches[_findIndex];
    _findMatches = collectMatches(_findInput.value);

    if (!_findMatches.length) {
        _findIndex = -1;
    } else if (jump) {
        _findIndex = pickStartIndex();
    } else {
        var same = -1;
        for (var i = 0; current && i < _findMatches.length; i++) {
            if (_findMatches[i].startContainer === current.startContainer &&
                _findMatches[i].startOffset === current.startOffset) { same = i; break; }
        }
        _findIndex = same >= 0 ? same : Math.min(Math.max(_findIndex, 0), _findMatches.length - 1);
    }

    paintFind();
    if (jump && _findIndex >= 0) revealMatch(_findMatches[_findIndex]);
}

function stepFind(direction) {
    if (!_findMatches.length) return;
    _findIndex = (_findIndex + direction + _findMatches.length) % _findMatches.length;
    paintFind();
    revealMatch(_findMatches[_findIndex]);
}

function paintFind() {
    if (_findCount) {
        var hasQuery = isFindOpen() && _findInput.value;
        _findCount.textContent = !hasQuery ? ''
            : _findMatches.length ? (_findIndex + 1) + ' of ' + _findMatches.length
            : 'No results';
        _findCount.classList.toggle('none', !!hasQuery && !_findMatches.length);
    }

    if (!_findCanPaint) return;
    if (_findMatches.length) {
        CSS.highlights.set('find-match', new Highlight(..._findMatches));
        var current = new Highlight(_findMatches[_findIndex]);
        current.priority = 1;
        CSS.highlights.set('find-current', current);
    } else {
        CSS.highlights.delete('find-match');
        CSS.highlights.delete('find-current');
    }
}

// Unfolds whatever hides the match, then scrolls it into view.
function revealMatch(range) {
    var el = range.startContainer.parentElement;
    if (!el) return;

    var items = el.closest('.activity-items');
    if (items && !items.classList.contains('visible')) {
        items.parentNode.querySelector('.activity-header').click();
    }
    var thinking = el.closest('.thinking-content');
    if (thinking && !thinking.classList.contains('visible')) {
        thinking.previousElementSibling.click();
    }
    var live = el.closest('.toolstep-expander-content');
    if (live && !live.classList.contains('visible')) {
        live.previousElementSibling.click();
    }

    // After the frame in which an opened block caps its own height, so the
    // cap can be taken off again when the match lies below it.
    requestAnimationFrame(function() {
        var capped = el.closest('.capped');
        if (capped) {
            capped.classList.remove('capped');
            var link = capped.nextElementSibling;
            if (link && link.classList.contains('show-more-link')) link.textContent = 'Show less';
        }

        var rect = range.getBoundingClientRect();
        var box = _container.getBoundingClientRect();
        // The bar covers the top of the chat.
        if (rect.top < box.top + 40 || rect.bottom > box.bottom - 20) {
            _container.scrollTop += rect.top - box.top - _container.clientHeight / 3;
        }
    });
}

window.addEventListener('keydown', function(e) {
    if (e.ctrlKey && !e.altKey && !e.shiftKey && (e.key === 'f' || e.key === 'F')) {
        e.preventDefault();
        openFind();
    } else if (e.key === 'F3' && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        findNext(e.shiftKey ? -1 : 1);
    } else if (e.key === 'Escape' && isFindOpen() && document.activeElement !== _findInput) {
        closeFind();
    }
});

// --- Copy button ---
// SVG icons for copy button
var ICON_COPY = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M3.5 10.5h-1a1.5 1.5 0 01-1.5-1.5v-6a1.5 1.5 0 011.5-1.5h6a1.5 1.5 0 011.5 1.5v1"/></svg>';
var ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.5 8.5 6.5 11.5 12.5 4.5"/></svg>';

function getMessageText(msgEl) {
    var type = msgEl.dataset.type;
    if (type === 'User' || type === 'Assistant') {
        var mc = msgEl.querySelector('.msg-content');
        return mc ? markdownSourceOf(mc) : '';
    } else if (type === 'ToolStep') {
        var name = msgEl.querySelector('.toolstep-name');
        var body = msgEl.querySelector('.msg-body');
        var streaming = msgEl.querySelector('.msg-streaming-content');
        var parts = [];
        if (name) parts.push(name.textContent);
        if (body && body.style.display !== 'none') parts.push(markdownSourceOf(body));
        else if (streaming) parts.push(streaming.textContent);
        return parts.join('\n');
    } else if (type === 'Thinking') {
        var tc = msgEl.querySelector('.thinking-content');
        return tc ? tc.textContent : '';
    } else if (type === 'Notice') {
        var nt = msgEl.querySelector('.notice-text');
        return nt ? nt.textContent : '';
    }
    return '';
}

function copyToClipboard(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
}

function flashCopied(btn) {
    btn.innerHTML = ICON_CHECK;
    btn.classList.add('copied');
    setTimeout(function() {
        btn.innerHTML = ICON_COPY;
        btn.classList.remove('copied');
    }, 1500);
}

// Wrap a block in a positioned container and pin a copy button to its corner.
// The wrapper is what keeps the button in place when the block scrolls.
function wrapWithCopyButton(el, wrapClass, btnClass, title, getText) {
    var wrap = document.createElement('div');
    wrap.className = wrapClass;
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(el);

    var btn = document.createElement('button');
    btn.className = btnClass;
    btn.title = title;
    btn.innerHTML = ICON_COPY;
    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var text = getText(el);
        if (!text) return;
        copyToClipboard(text.replace(/\n$/, ''));
        flashCopied(btn);
    });
    wrap.appendChild(btn);

    // A block at the very top of a message would sit under the message-level
    // copy button; yield to the block's own button while hovering.
    wrap.addEventListener('mouseenter', function() {
        var msg = this.closest('.msg');
        if (msg) msg.classList.add('code-hover');
    });
    wrap.addEventListener('mouseleave', function() {
        var msg = this.closest('.msg');
        // Leaving a quote nested in another one is not leaving the outer
        // block, so only give the message-level button back when no block in
        // this message is under the pointer any more.
        if (msg && !msg.querySelector('.code-block:hover, .quote-block:hover')) {
            msg.classList.remove('code-hover');
        }
    });
}

// Give every fenced code block and every block quote its own copy button, so a
// prompt or snippet can be taken without selecting it by hand.
function addBlockCopyButtons(container) {
    var pres = container.querySelectorAll('pre');
    for (var i = 0; i < pres.length; i++) {
        var pre = pres[i];
        if (pre.parentNode && pre.parentNode.classList.contains('code-block')) continue;

        wrapWithCopyButton(pre, 'code-block', 'code-copy-btn', 'Copy code to clipboard', function(target) {
            var code = target.querySelector('code');
            return (code || target).innerText;
        });
    }

    var quotes = container.querySelectorAll('blockquote');
    for (var j = 0; j < quotes.length; j++) {
        var quote = quotes[j];
        if (quote.parentNode && quote.parentNode.classList.contains('quote-block')) continue;

        // A quote inside another gets its own button as well: the inner quote
        // is usually the line you want, and the outer one still copies both.
        wrapWithCopyButton(quote, 'quote-block', 'quote-copy-btn', 'Copy quote to clipboard', function(target) {
            return target.innerText;
        });
    }
}

function addCopyButton(msgDiv) {
    var btn = document.createElement('button');
    btn.className = 'msg-copy-btn';
    btn.title = 'Copy to clipboard';
    btn.innerHTML = ICON_COPY;
    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var text = getMessageText(msgDiv);
        if (!text) return;
        copyToClipboard(text);
        flashCopied(btn);
    });
    msgDiv.appendChild(btn);
}

// Patch addMessage to include copy button
var _origAddMessage = addMessage;
addMessage = function(id, type, dataJson) {
    _origAddMessage(id, type, dataJson);
    var el = document.getElementById('msg-' + id);
    if (el) addCopyButton(el);
};

// Patch loadMessages to include copy buttons
var _origLoadMessages = loadMessages;
loadMessages = function(jsonArray) {
    _origLoadMessages(jsonArray);
    var msgs = _container.querySelectorAll('.msg');
    for (var i = 0; i < msgs.length; i++) {
        if (!msgs[i].querySelector('.msg-copy-btn')) {
            addCopyButton(msgs[i]);
        }
    }
};

// --- Context menu ---
// One menu, refilled on every right-click with what fits the target: a file
// link gets the file actions, a selection gets Copy.
var _ctxMenu;
function showCtxMenu(e, items) {
    if (!_ctxMenu) {
        _ctxMenu = document.createElement('div');
        _ctxMenu.className = 'ctx-menu';
        document.body.appendChild(_ctxMenu);
    }
    _ctxMenu.innerHTML = '';
    items.forEach(function(item) {
        var el = document.createElement('div');
        el.className = 'ctx-menu-item';
        el.textContent = item.label;
        el.addEventListener('click', function() {
            _ctxMenu.style.display = 'none';
            item.run();
        });
        _ctxMenu.appendChild(el);
    });
    _ctxMenu.style.display = 'block';
    // Position near cursor, clamped to viewport. Measured once shown, since
    // the size depends on the items.
    var x = Math.min(e.clientX, window.innerWidth - _ctxMenu.offsetWidth - 4);
    var y = Math.min(e.clientY, window.innerHeight - _ctxMenu.offsetHeight - 4);
    _ctxMenu.style.left = Math.max(0, x) + 'px';
    _ctxMenu.style.top = Math.max(0, y) + 'px';
}

document.addEventListener('contextmenu', function(e) {
    if (_ctxMenu) _ctxMenu.style.display = 'none';

    // Both can apply at once: a link inside selected text. The file actions come
    // first, because the link is what was clicked, but Copy has to stay on the
    // menu or selecting a paragraph that mentions a file leaves no way to copy it.
    var items = [];

    var link = e.target.closest('a.file-link');
    var path = link && link.dataset.path;
    if (path) {
        items.push({ label: 'Open', run: function() { requestFileLink('open', path); } });
        items.push({ label: 'Copy path', run: function() { requestFileLink('copyPath', path); } });
        items.push({ label: 'Show in Explorer', run: function() { requestFileLink('showInExplorer', path); } });
    }

    var sel = window.getSelection().toString();
    if (sel) {
        items.push({ label: 'Copy', run: function() { copyToClipboard(sel); } });
    }

    if (items.length) {
        e.preventDefault();
        showCtxMenu(e, items);
    }
});

document.addEventListener('click', function() {
    if (_ctxMenu) _ctxMenu.style.display = 'none';
});

document.addEventListener('DOMContentLoaded', function() {
    _container = document.getElementById('chat-container');
    _container.addEventListener('scroll', function() {
        _userScrolledUp = !isNearBottom();
        updateScrollButton();
    });
    createScrollButton();

    // The webview shrinks whenever the host grows the area below it - the input
    // box gaining a line as the user types, the "Thinking..." bar appearing, a
    // banner opening, the resize grip being dragged. Scrolling happened against
    // the old height, so without this the last message ends up clipped by the
    // new bottom edge until the next chunk of output arrives.
    if (window.ResizeObserver) {
        var reanchor = new ResizeObserver(function() {
            if (!_userScrolledUp) scrollToBottom();
        });
        reanchor.observe(_container);
    } else {
        window.addEventListener('resize', function() {
            if (!_userScrolledUp) scrollToBottom();
        });
    }

    // Images and fonts settle after their message is already in the DOM and
    // push the content taller; re-pin so they don't shove the tail off-screen.
    document.addEventListener('load', function(e) {
        if (e.target && e.target.tagName === 'IMG' && !_userScrolledUp) scrollToBottom();
    }, true);
});
</script>
</head>
<body>
<div id="chat-container"></div>
</body>
</html>
